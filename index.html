<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KSSM Full Syllabus Math Generator</title>
  <!-- KaTeX for crisp Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card">
    <h2>KSSM Math Generator (Forms 1–5)</h2>
    
    <!-- Level Selectors -->
    <div class="filter-group">
      <label for="formSelect">Form:</label>
      <select id="formSelect" onchange="updateTopicDropdown()">
        <option value="form1">Form 1</option>
        <option value="form2">Form 2</option>
        <option value="form3">Form 3</option>
        <option value="form4">Form 4</option>
        <option value="form5">Form 5</option>
      </select>

      <label for="topicSelect">Topic:</label>
      <select id="topicSelect" onchange="generateQuestion()"></select>
    </div>

    <div class="question-box" id="questionBox">Select a topic to start!</div>

    <!-- Answer Area -->
    <div id="numericInputArea">
      <input type="number" id="userAnswer" placeholder="Enter your answer" />
      <button onclick="checkAnswer(parseFloat(document.getElementById('userAnswer').value))">Submit</button>
    </div>

    <div id="mcqArea" class="mcq-options" style="display:none;"></div>

    <button onclick="generateQuestion()" class="btn-refresh">New Question ↻</button>

    <div class="feedback" id="feedback"></div>
  </div>

  <!-- Load Generators -->
  <script src="js/form1.js"></script>
  <script src="js/form2.js"></script>
  <script src="js/form3.js"></script>
  <script src="js/form4.js"></script>
  <script src="js/form5.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
