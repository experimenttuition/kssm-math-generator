<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KSSM Infinite Math Generator</title>
  <!-- KaTeX for crisp Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background: #f4f7f6; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    select, button, input { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    .question-box { font-size: 22px; margin: 25px 0; text-align: center; }
    .feedback { font-weight: bold; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>KSSM Math Question Generator</h2>
    
    <label for="topic">Choose KSSM Topic:</label>
    <select id="topic" onchange="generateQuestion()">
      <option value="linear">Form 1: Linear Equations (ax + b = c)</option>
      <option value="indices">Form 3: Laws of Indices (a^m × a^n)</option>
    </select>

    <div class="question-box" id="questionBox">Click generate to start!</div>

    <input type="number" id="userAnswer" placeholder="Enter your answer" />
    <button onclick="checkAnswer()">Submit Answer</button>
    <button onclick="generateQuestion()" style="background:#28a745; margin-top:8px;">New Question ↻</button>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    let currentCorrectAnswer = null;

    // Helper: Random integer generator
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Question Generators
    function generateQuestion() {
      const topic = document.getElementById('topic').value;
      const questionBox = document.getElementById('questionBox');
      document.getElementById('feedback').innerText = '';
      document.getElementById('userAnswer').value = '';

      if (topic === 'linear') {
        // Generates: ax + b = c  (Ensures x is a clean integer)
        const x = getRandomInt(1, 10);
        const a = getRandomInt(2, 6);
        const b = getRandomInt(1, 15);
        const c = a * x + b;
        
        currentCorrectAnswer = x;
        const latexStr = `Solve\\ for\\ x:\\ \\ \\ \\ ${a}x + ${b} = ${c}`;
        katex.render(latexStr, questionBox);

      } else if (topic === 'indices') {
        // Generates: Simplify a^m * a^n -> find total exponent
        const base = getRandomInt(2, 5);
        const m = getRandomInt(2, 6);
        const n = getRandomInt(2, 6);
        
        currentCorrectAnswer = m + n; // Answer is the simplified power
        const latexStr = `Simplify:\\ \\ ${base}^{${m}} \\times ${base}^{${n}} = ${base}^x \\quad (Find\\ x)`;
        katex.render(latexStr, questionBox);
      }
    }

    function checkAnswer() {
      const userAns = parseFloat(document.getElementById('userAnswer').value);
      const feedback = document.getElementById('feedback');
      
      if (isNaN(userAns)) {
        feedback.innerText = "Please enter a value.";
        feedback.style.color = "orange";
        return;
      }

      if (userAns === currentCorrectAnswer) {
        feedback.innerText = "Correct! Well done! 🎉";
        feedback.style.color = "green";
      } else {
        feedback.innerText = `Incorrect. The answer is ${currentCorrectAnswer}. Try another one!`;
        feedback.style.color = "red";
      }
    }

    // Generate first question automatically on page load
    window.onload = generateQuestion;
  </script>
</body>
</html>
